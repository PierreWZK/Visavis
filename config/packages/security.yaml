security:
    # Un seul compte, l'administrateur du catalogue : identifiants dans .env.local (ADMIN_USER, ADMIN_PASSWORD_HASH)
    # Générer le hash : php bin/console security:hash-password
    password_hashers:
        Symfony\Component\Security\Core\User\InMemoryUser: 'auto'

    providers:
        admin:
            memory:
                users:
                    '%env(ADMIN_USER)%': { password: '%env(ADMIN_PASSWORD_HASH)%', roles: ['ROLE_ADMIN'] }

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: admin
            http_basic:
                realm: 'Vis-à-vis admin'

    access_control:
        - { path: ^/admin, roles: ROLE_ADMIN }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\InMemoryUser:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
